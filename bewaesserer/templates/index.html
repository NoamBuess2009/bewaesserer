<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bewässerung</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>🌱 Bewässerung</h1>
    <section class="card status {{ 'active' if status.watering else '' }}">
      <span class="dot"></span>
      <div><small>GPIO 18</small><strong id="state">{{ 'Bewässerung läuft' if status.watering else 'Ausgeschaltet' }}</strong></div>
    </section>
    <section class="actions">
      <form method="post" action="/start"><button class="start">Jetzt bewässern</button></form>
      <form method="post" action="/stop"><button class="stop">Stoppen</button></form>
    </section>
    <section class="card">
      <h2>Zeitplan</h2>
      <form method="post" action="/settings" class="settings">
        <label>Erste Bewässerung<input name="time_1" type="time" value="{{ settings.times[0] }}" required></label>
        <label>Zweite Bewässerung<input name="time_2" type="time" value="{{ settings.times[1] }}" required></label>
        <label>Dauer in Sekunden<input name="duration" type="number" min="1" max="3600" value="{{ settings.duration_seconds }}" required></label>
        <button>Speichern</button>
      </form>
    </section>
  </main>
  <script>
    setInterval(async () => {
      const status = await fetch('/api/status').then(response => response.json());
      document.querySelector('.status').classList.toggle('active', status.watering);
      document.querySelector('#state').textContent = status.watering ? 'Bewässerung läuft' : 'Ausgeschaltet';
    }, 2000);
  </script>
</body>
</html>
